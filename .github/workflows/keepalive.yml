name: keepalive

# Pega a /health una vez al dia para que Supabase no pause el proyecto por inactividad.
# Configura el secreto APP_URL en GitHub: Settings > Secrets and variables > Actions.
on:
  schedule:
    - cron: "17 6 * * *" # diario, 06:17 UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: curl -fsS "${{ secrets.APP_URL }}/health"
